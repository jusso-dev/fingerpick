name: FingerPick
options:
  bundleIdPrefix: dev.jusso
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en-AU
  createIntermediateGroups: true
  xcodeVersion: "27.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  FingerPickKit:
    path: Packages/FingerPickKit

targets:
  FingerPick:
    type: application
    platform: iOS
    sources:
      - path: FingerPick
        excludes:
          - Resources/Info.plist
    dependencies:
      - package: FingerPickKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.fingerpick
        PRODUCT_NAME: FingerPick
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FingerPick/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: FingerPick
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  FingerPickTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FingerPickTests
    dependencies:
      - target: FingerPick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.fingerpick.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FingerPick.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FingerPick

  FingerPickUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/FingerPickUITests
    dependencies:
      - target: FingerPick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jusso.fingerpick.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FingerPick

schemes:
  FingerPick:
    build:
      targets:
        FingerPick: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - FingerPick
        - package: FingerPickKit/FingerPickKit
      targets:
        - FingerPickTests
        - FingerPickUITests
        - package: FingerPickKit/FingerPickKitTests

  # Manual pseudo-localisation check (#24): every string doubled in length.
  FingerPick (Double-length):
    build:
      targets:
        FingerPick: all
    run:
      config: Debug
      commandLineArguments:
        "-NSDoubleLocalizedStrings YES": true
